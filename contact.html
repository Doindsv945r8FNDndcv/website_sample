<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · Johan de Jong</title>
<link rel="stylesheet" href="nocturne.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<div class="page glow-bottom">
<div class="wrap">
<header class="nav site-nav" id="top">
<a class="nav-brand" href="index.html">Johan de Jong</a>
<nav class="nav-links" id="nav-links" aria-label="Main"><a href="index.html">Home</a><a href="bio.html">Bio</a><a href="cv.html">CV</a><a href="contact.html" aria-current="page">Contact</a></nav>
<button class="btn btn-icon btn-secondary menu-btn" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"/></svg></button>
</header>
<main>
<section class="contact">
<div>
<h1>Let's talk.</h1>
<p class="lede text-muted">I'm open to design lead roles, research projects and the occasional talk. I usually reply within two days.</p>
<a class="email" href="mailto:hello@junokafor.com">hello@junokafor.com</a>
<div class="links">
<a href="#"><span>LinkedIn</span><span class="handle text-muted">/in/junokafor</span></a>
<a href="#"><span>Read.cv</span><span class="handle text-muted">read.cv/jun</span></a>
<a href="#"><span>Instagram</span><span class="handle text-muted">@junatnight</span></a>
</div>
</div>
<form class="card elev-md note-form" onsubmit="event.preventDefault();this.querySelector('.form-status').textContent='Thanks. Your note is ready to send once the form is wired to an inbox.'">
<div class="card-kicker">Send a note</div>
<div class="field"><label for="f-name">Name</label><input class="input" id="f-name" name="name" placeholder="Your name" required></div>
<div class="field"><label for="f-email">Email</label><input class="input" id="f-email" name="email" type="email" placeholder="you@example.com" required></div>
<div class="field"><label>About</label><div class="seg"><label class="seg-opt"><input type="radio" name="about" checked>A role</label><label class="seg-opt"><input type="radio" name="about">A project</label><label class="seg-opt"><input type="radio" name="about">Something else</label></div></div>
<div class="field"><label for="f-msg">Message</label><textarea class="input" id="f-msg" name="message" placeholder="A few lines is plenty"></textarea></div>
<button class="btn btn-primary btn-block" type="submit">Send</button>
<p class="form-status" role="status"></p>
</form>
</section>
</main>
<footer class="site-foot text-muted">© 2026 Johan de Jong</footer>
</div>
</div>
<script>
const nav = document.getElementById('top'), btn = nav.querySelector('.menu-btn');
btn.addEventListener('click', () => btn.setAttribute('aria-expanded', nav.classList.toggle('open')));
</script>
</body>
</html>
